[package]
name = "binance-websocket"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1.4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
anyhow = "1.0"
rand = "0.8"
fin-primitives = { version = "3.1", default-features = false, features = ["indicators"], optional = true }
rust_decimal = { version = "1.36", default-features = false, features = ["std"], optional = true }

[features]
# Streaming RSI / MACD / EMA over candle closes (src/ta.rs).
indicators = ["dep:fin-primitives", "dep:rust_decimal"]
